<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能养老陪护巡逻机器人 - 系统结构图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f2f5;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    display: flex;
    justify-content: center;
    padding: 30px 20px;
  }
  .container {
    max-width: 1250px;
    width: 100%;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 28px 24px;
  }
  h1 {
    text-align: center;
    font-size: 21px;
    color: #1a1a2e;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  .subtitle {
    text-align: center;
    color: #999;
    font-size: 13px;
    margin-bottom: 20px;
  }

  svg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* 图例 */
  .legend {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid #eee;
    font-size: 12px;
    color: #666;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-line {
    width: 32px;
    height: 3px;
    border-radius: 2px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🔋 智能养老陪护巡逻机器人 · 系统硬件结构图</h1>
  <p class="subtitle">自造 ROS 底盘 + Jetson Orin Nano Super 本地化部署 | 2026-07-23</p>

  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" style="background:#fafafa;border-radius:10px;">
    <defs>
      <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
        <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
      </filter>
      <filter id="shadow-lg" x="-4%" y="-4%" width="108%" height="116%">
        <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.10"/>
      </filter>

      <!-- 箭头标记 -->
      <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#fa8c16"/>
      </marker>

      <!-- 区域背景 -->
      <linearGradient id="bg-power" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fffbe6"/>
        <stop offset="100%" stop-color="#fff7e0"/>
      </linearGradient>
      <linearGradient id="bg-ctrl" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f0f5ff"/>
        <stop offset="100%" stop-color="#e8f0fe"/>
      </linearGradient>
      <linearGradient id="bg-sensor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f6ffed"/>
        <stop offset="100%" stop-color="#edfae3"/>
      </linearGradient>
      <linearGradient id="bg-motor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fff7e6"/>
        <stop offset="100%" stop-color="#fff0d6"/>
      </linearGradient>
    </defs>

    <!-- ==================== 区域背景 ==================== -->
    <!-- 左区：电源 -->
    <rect x="20" y="50" width="210" height="720" rx="12" fill="url(#bg-power)" stroke="#ffe58f" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="125" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#d48806">🔋 电源系统</text>

    <!-- 中区：控制链路 -->
    <rect x="250" y="50" width="310" height="720" rx="12" fill="url(#bg-ctrl)" stroke="#adc6ff" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="405" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#1d39c4">🔄 控制链路</text>

    <!-- 右上：Jetson 传感器 -->
    <rect x="580" y="50" width="600" height="260" rx="12" fill="url(#bg-sensor)" stroke="#b7eb8f" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="880" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#389e0d">📡 Jetson Orin Nano Super 连接的传感器</text>

    <!-- 右中：STM32 连接设备 -->
    <rect x="580" y="325" width="600" height="270" rx="12" fill="url(#bg-ctrl)" stroke="#adc6ff" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="880" y="355" text-anchor="middle" font-size="15" font-weight="700" fill="#1d39c4">🔌 STM32 连接的设备</text>

    <!-- 右下：驱动板连接电机 -->
    <rect x="580" y="615" width="600" height="170" rx="12" fill="url(#bg-motor)" stroke="#ffd591" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="880" y="645" text-anchor="middle" font-size="15" font-weight="700" fill="#d46b08">⚡ 驱动板 (TB6612) 连接的电机</text>

    <!-- ==================== 节点框 ==================== -->

    <!-- === 左列：电源节点 === -->

    <!-- 12V 电池组 -->
    <rect x="50" y="110" width="150" height="65" rx="10" fill="#fff7e6" stroke="#faad14" stroke-width="2" filter="url(#shadow)"/>
    <text x="125" y="138" text-anchor="middle" font-size="22">🔋</text>
    <text x="125" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#333">12V 电池组</text>
    <text x="125" y="170" text-anchor="middle" font-size="10" fill="#999">24.80 元</text>

    <!-- 12V→12V 稳压 -->
    <rect x="55" y="230" width="140" height="46" rx="8" fill="#fff7e6" stroke="#faad14" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="125" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#d48806">12V→12V 稳压</text>
    <text x="125" y="267" text-anchor="middle" font-size="10" fill="#999">给 Jetson 供电 · 21 元</text>

    <!-- 12V→5V 稳压 -->
    <rect x="55" y="330" width="140" height="46" rx="8" fill="#fff7e6" stroke="#faad14" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="125" y="350" text-anchor="middle" font-size="13" font-weight="600" fill="#d48806">12V→5V 2A 稳压</text>
    <text x="125" y="367" text-anchor="middle" font-size="10" fill="#999">给 STM32 供电 · 14 元</text>

    <!-- 直连驱动板标注 -->
    <rect x="55" y="430" width="140" height="46" rx="8" fill="#fff7e6" stroke="#faad14" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#shadow)"/>
    <text x="125" y="450" text-anchor="middle" font-size="13" font-weight="600" fill="#d48806">⬅ 直连驱动板</text>
    <text x="125" y="467" text-anchor="middle" font-size="10" fill="#999">驱动板自带稳压</text>

    <!-- 电源说明 -->
    <rect x="38" y="530" width="180" height="95" rx="8" fill="#fff1f0" stroke="#ffa39e" stroke-width="1"/>
    <text x="128" y="555" text-anchor="middle" font-size="12" font-weight="600" fill="#cf1322">⚡ 电源架构</text>
    <text x="128" y="575" text-anchor="middle" font-size="11" fill="#666">电池 → 直连驱动板</text>
    <text x="128" y="592" text-anchor="middle" font-size="11" fill="#666">(驱动板自带稳压)</text>
    <text x="128" y="610" text-anchor="middle" font-size="11" fill="#666">电池 → 12-12V → Jetson</text>
    <text x="128" y="625" text-anchor="middle" font-size="11" fill="#666">电池 → 12-5V → STM32</text>

    <!-- === 中列：控制链路节点 === -->

    <!-- Jetson -->
    <rect x="305" y="120" width="200" height="70" rx="12" fill="#e6f7ff" stroke="#1890ff" stroke-width="2.5" filter="url(#shadow-lg)"/>
    <text x="405" y="148" text-anchor="middle" font-size="20">🧠</text>
    <text x="405" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#0050b3">Jetson Orin Nano Super</text>
    <text x="405" y="183" text-anchor="middle" font-size="10" fill="#666">8GB | 本地大脑 · 3,869 元</text>

    <!-- STM32 -->
    <rect x="305" y="260" width="200" height="70" rx="12" fill="#f0f5ff" stroke="#2f54eb" stroke-width="2.5" filter="url(#shadow-lg)"/>
    <text x="405" y="288" text-anchor="middle" font-size="20">⚙️</text>
    <text x="405" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#1d39c4">STM32F103ZET6</text>
    <text x="405" y="323" text-anchor="middle" font-size="10" fill="#666">底盘底层控制 · 61 元</text>

    <!-- TB6612 驱动板 -->
    <rect x="305" y="400" width="200" height="70" rx="12" fill="#fff0f6" stroke="#eb2f96" stroke-width="2.5" filter="url(#shadow-lg)"/>
    <text x="405" y="428" text-anchor="middle" font-size="20">🏎️</text>
    <text x="405" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#c41d7f">TB6612 FNG 电机驱动</text>
    <text x="405" y="463" text-anchor="middle" font-size="10" fill="#666">双路驱动 · 自带稳压 · 69 元</text>

    <!-- === 右上：Jetson 传感器 === -->

    <!-- IMX219 -->
    <rect x="610" y="105" width="160" height="55" rx="8" fill="#e6fffb" stroke="#13c2c2" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="690" y="128" text-anchor="middle" font-size="16">📷</text>
    <text x="690" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="#006d75">IMX219 摄像头</text>
    <text x="690" y="157" text-anchor="middle" font-size="10" fill="#999">白天彩色视觉 · 47 元</text>

    <!-- 红外摄像头 -->
    <rect x="790" y="105" width="170" height="55" rx="8" fill="#e6fffb" stroke="#13c2c2" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="875" y="128" text-anchor="middle" font-size="16">🌙</text>
    <text x="875" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="#006d75">22pin 160° 红外摄像头</text>
    <text x="875" y="157" text-anchor="middle" font-size="10" fill="#999">夜间红外视觉 · 84 元</text>

    <!-- T-MINI 激光雷达 -->
    <rect x="980" y="105" width="175" height="55" rx="8" fill="#f6ffed" stroke="#52c41a" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="1067" y="128" text-anchor="middle" font-size="16">📡</text>
    <text x="1067" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="#389e0d">T-MINI 激光雷达</text>
    <text x="1067" y="157" text-anchor="middle" font-size="10" fill="#999">12m · SLAM 建图 · 419 元</text>



    <!-- === 右中：STM32 连接设备 === -->

    <!-- 第一行：编码器 + IMU -->
    <rect x="610" y="380" width="240" height="55" rx="8" fill="#f0f5ff" stroke="#2f54eb" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="730" y="403" text-anchor="middle" font-size="16">🌀</text>
    <text x="730" y="420" text-anchor="middle" font-size="13" font-weight="600" fill="#1d39c4">编码器 ×4 (GMR)</text>
    <text x="730" y="435" text-anchor="middle" font-size="10" fill="#999">速度 / 里程反馈</text>

    <rect x="880" y="380" width="240" height="55" rx="8" fill="#f0f5ff" stroke="#2f54eb" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="1000" y="403" text-anchor="middle" font-size="16">📟</text>
    <text x="1000" y="420" text-anchor="middle" font-size="13" font-weight="600" fill="#1d39c4">IMU 模块（可选）</text>
    <text x="1000" y="435" text-anchor="middle" font-size="10" fill="#999">姿态数据 · 角度校正</text>

    <!-- 第二行：LD6002 呼吸心跳 + LD6002C 跌倒检测 -->
    <rect x="610" y="460" width="240" height="55" rx="8" fill="#f6ffed" stroke="#52c41a" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="730" y="483" text-anchor="middle" font-size="16">💓</text>
    <text x="730" y="500" text-anchor="middle" font-size="13" font-weight="600" fill="#389e0d">LD6002 呼吸心跳雷达</text>
    <text x="730" y="515" text-anchor="middle" font-size="10" fill="#999">60GHz 非接触体征 · 75 元</text>

    <rect x="880" y="460" width="240" height="55" rx="8" fill="#f6ffed" stroke="#52c41a" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="1000" y="483" text-anchor="middle" font-size="16">⚠️</text>
    <text x="1000" y="500" text-anchor="middle" font-size="13" font-weight="600" fill="#389e0d">LD6002C 跌倒检测雷达</text>
    <text x="1000" y="515" text-anchor="middle" font-size="10" fill="#999">60GHz 跌倒识别 · 127 元</text>

    <!-- === 右下：驱动板连接电机 === -->

    <!-- 四个电机 -->
    <rect x="610" y="650" width="120" height="55" rx="8" fill="#fffbe6" stroke="#fa8c16" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="670" y="673" text-anchor="middle" font-size="16">🅰️</text>
    <text x="670" y="690" text-anchor="middle" font-size="13" font-weight="600" fill="#d46b08">电机 ①</text>
    <text x="670" y="702" text-anchor="middle" font-size="10" fill="#999">MG513X · 78.80 元</text>

    <rect x="750" y="650" width="120" height="55" rx="8" fill="#fffbe6" stroke="#fa8c16" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="810" y="673" text-anchor="middle" font-size="16">🅱️</text>
    <text x="810" y="690" text-anchor="middle" font-size="13" font-weight="600" fill="#d46b08">电机 ②</text>
    <text x="810" y="702" text-anchor="middle" font-size="10" fill="#999">MG513X · 78.80 元</text>

    <rect x="890" y="650" width="120" height="55" rx="8" fill="#fffbe6" stroke="#fa8c16" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="950" y="673" text-anchor="middle" font-size="16">🆑</text>
    <text x="950" y="690" text-anchor="middle" font-size="13" font-weight="600" fill="#d46b08">电机 ③</text>
    <text x="950" y="702" text-anchor="middle" font-size="10" fill="#999">MG513X · 78.80 元</text>

    <rect x="1030" y="650" width="120" height="55" rx="8" fill="#fffbe6" stroke="#fa8c16" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="1090" y="673" text-anchor="middle" font-size="16">🅳</text>
    <text x="1090" y="690" text-anchor="middle" font-size="13" font-weight="600" fill="#d46b08">电机 ④</text>
    <text x="1090" y="702" text-anchor="middle" font-size="10" fill="#999">MG513X · 78.80 元</text>

    <!-- 麦轮标注 -->
    <rect x="700" y="725" width="360" height="35" rx="6" fill="#fafafa" stroke="#d9d9d9" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="880" y="747" text-anchor="middle" font-size="12" fill="#999">🛞 麦轮 + 联轴器 · 全向移动（前/后/横移/原地旋转）· 53 元</text>

    <!-- ==================== 连接线 ==================== -->

    <!-- === 电源连接线 === -->

    <!-- 电池 → 12V→12V -->
    <path d="M 125,175 L 125,218" stroke="#fa8c16" stroke-width="2.5" fill="none" marker-end="url(#arr-orange)"/>
    <text x="145" y="200" font-size="10" fill="#fa8c16" font-weight="500">12V</text>

    <!-- 电池 → 12V→5V -->
    <path d="M 60,150 L 30,150 L 30,353 L 55,353" stroke="#fa8c16" stroke-width="2.5" fill="none" marker-end="url(#arr-orange)"/>
    <text x="18" y="255" font-size="10" fill="#fa8c16" font-weight="500" transform="rotate(-90,18,255)">12V</text>

    <!-- 电池 → 直连驱动板 -->
    <path d="M 170,145 C 210,145 240,300 505,300" stroke="#fa8c16" stroke-width="2.5" fill="none" stroke-dasharray="7,4" marker-end="url(#arr-orange)"/>
    <text x="300" y="278" font-size="11" fill="#fa8c16" font-weight="500">12V 直连（驱动板自带稳压）</text>

    <!-- ==================== 总价标注 ==================== -->
    <rect x="900" y="740" width="260" height="28" rx="6" fill="#fafafa" stroke="#d9d9d9" stroke-width="1"/>
    <text x="1030" y="758" text-anchor="middle" font-size="13" font-weight="700" fill="#333">💰 硬件总价：约 5,212 元</text>

  </svg>

  <!-- 图例 -->
  <div class="legend">
    <div class="legend-item">
      <div class="legend-line" style="background:#fa8c16;"></div>
      <span>供电线</span>
    </div>
    <div class="legend-item">
      <div class="legend-line" style="background:#fa8c16;stroke-dasharray:7,4;"></div>
      <span>直连供电（驱动板自带稳压）</span>
    </div>
  </div>
</div>
</body>
</html>
