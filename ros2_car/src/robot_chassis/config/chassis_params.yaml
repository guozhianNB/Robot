# STM32 麦轮底盘驱动参数（robot_chassis/chassis_driver）
# 说明见 README.md「标定」节；真机联调时按实测值修改。

chassis_driver:
  ros__parameters:
    # ---- 串口（USB CDC，见 docs/USB车控接口.md）----
    serial_port: /dev/ttyACM0
    baudrate: 115200

    # ---- 话题/坐标系 ----
    cmd_vel_topic: /cmd_vel
    odom_topic: /odom
    cmd_stop_topic: /robot/cmd_stop
    odom_frame_id: odom
    base_frame_id: base_link
    # 是否由本节点发布 odom→base_link TF；use_ekf:=true 时 odom.launch.py 会强制传 false
    # （TF 由 EKF 统一发布，避免双发布）
    publish_tf: true

    # ---- 麦轮运动学几何（单位 m）----
    wheel_radius: 0.04        # 轮半径；固件默认轮径 80mm → 0.04
    rotate_radius: 0.15       # L+W（旋转半径）；固件默认 150mm
    wheel_signs: [1, 1, 1, 1] # 四轮方向修正 (LF,RF,LR,RR)，方向反了改 -1
    # 【2026-09-03 真机症状：遥控方向正确但 odom/tf 前后左右全反 → 编码器反馈与真实运动反号，
    #  三个 sign 先全取反。改后按 README「标定」1 真机复测：若仅个别轴反，只把对应行改回 1.0。】
    # 【2026-09-04 复测：命令 +vx(前进)，车头物理真前进，但 odom 记成 −x → 前进轴仍反。
    #    empirical fix: sign_vx 改回 +1.0。其余 vy/wz 待逐个复测后再定。】
    sign_vx: 1.0              # 前进轴方向修正（±1）【已实测改回 +1.0】
    sign_vy: -1.0             # 横移轴方向修正（±1）
    sign_wz: -1.0             # 自转轴方向修正（±1）

    # ---- 速度限制（养老院场景，安全优先）----
    max_vx: 0.5               # m/s
    max_vy: 0.3               # m/s（麦轮横移）
    max_wz: 0.8               # rad/s
    accel_limit: 0.5          # m/s^2
    ang_accel_limit: 0.8      # rad/s^2

    # ---- 时序 ----
    send_period: 0.05         # 下发周期 s（20Hz，兼作链路保活）
    watchdog_timeout: 0.5     # cmd_vel 看门狗 s（键盘遥控需放宽；nav2 高频下发不受影响）

    # ---- IMU（STM32 USART3 转发 → USB 帧 0x83 → /imu，见 docs/目标文档及说明/USB车控接口.md v1.1）----
    publish_imu: true
    imu_topic: /imu
    imu_frame_id: imu_link
    # 符号标定：手托车体逆时针转，/imu 的 yaw 与 angular_velocity.z 应增大；反了改 -1
    imu_sign_yaw: 1.0
    imu_sign_wz: 1.0
    imu_yaw_var: 0.02         # rad^2（必须非零，否则 robot_localization 当 1e-6 完全信任）
    imu_wz_var: 0.01          # (rad/s)^2
