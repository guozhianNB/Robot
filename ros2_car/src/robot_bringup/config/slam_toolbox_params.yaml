# slam_toolbox 建图参数（async SLAM）
# 建图:  ros2 launch robot_bringup slam.launch.py mode:=mapping
# 定位:  ros2 launch robot_bringup slam.launch.py mode:=localization map:=<map.yaml>

slam_toolbox:
  ros__parameters:
    use_sim_time: false

    # 坐标系
    base_frame: base_link
    odom_frame: odom
    map_frame: map

    # 模式: mapping | localization | lifelong
    mode: mapping
    scan_topic: /scan

    # 建图节奏
    map_update_interval: 5.0
    minimum_time_interval: 0.5
    max_laser_range: 12.0
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    # 分辨率
    resolution: 0.05
    max_range: 12.0
    min_range: 0.03

    # 激光匹配
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 10.0

    # 回环检测
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    loop_search_maximum_distance: 4.0

    # 相关搜索空间
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Ceres 扫描匹配器
    ceres_scan_matcher_translation_robustness: 0.1
    ceres_scan_matcher_rotation_robustness: 0.001

    # 位姿图优化
    use_scan_matching_pose_update: true
    scan_matching_pose_update_threshold: 0.05
    scan_matching_pose_update_interval: 1.0
    pose_publish_period: 0.1
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
